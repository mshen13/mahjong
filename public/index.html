<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mahjong!</title>
<style>
  :root {
    --char-color: #e06c6c;
    --bam-color: #6ce089;
    --circ-color: #6ca8e0;
    --honor-color: #e0c56c;
  }
  body {
    background: #1b1d22;
    color: #d8d8d8;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 18px;
    color: #f0f0f0;
    margin: 0 0 12px 0;
  }

  #lobby {
    max-width: 480px;
    margin: 40px auto;
    background: #24262e;
    border: 1px solid #33363f;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
  }
  #lobby h2 { margin-top: 0; font-size: 16px; color: #f0f0f0; }
  #lobby .divider { margin: 20px 0; color: #5a5e68; font-size: 12px; }
  #lobby input {
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    width: 120px;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #45484f;
    background: #1b1d22;
    color: #fff;
    margin-right: 8px;
  }
  #lobbyStatus { margin-top: 16px; font-size: 13px; color: #cfd6cf; min-height: 1.4em; }
  #shareLink {
    margin-top: 10px;
    font-size: 13px;
    word-break: break-all;
    background: #1b1d22;
    border-radius: 6px;
    padding: 8px;
    color: var(--honor-color);
  }

  /* ---- Square table ---- */
  #table {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 2.2fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      ".    top    ."
      "left center right"
      ".    bottom .";
    gap: 10px;
    max-width: 840px;
    margin: 0 auto 14px auto;
    background: #15321f;
    border: 6px solid #3a2a18;
    border-radius: 14px;
    padding: 12px;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.45);
  }
  .seat {
    background: rgba(0, 0, 0, 0.18);
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .seat-top { grid-area: top; }
  .seat-left { grid-area: left; }
  .seat-right { grid-area: right; }
  .seat-bottom { grid-area: bottom; }
  .seat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .seat-name { font-size: 13px; color: #f0f0f0; font-weight: bold; }
  .seat-backs { display: flex; flex-wrap: wrap; gap: 2px; }
  .seat-melds { display: flex; flex-wrap: wrap; gap: 6px; min-height: 2px; }
  .river {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    min-height: 2px;
    padding: 4px;
    background: rgba(0, 0, 0, 0.15);
    border-radius: 6px;
  }
  #center {
    grid-area: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wall-count {
    color: #cfd6cf;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 6px;
    padding: 6px 12px;
  }
  #animLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }
  .discard-anim {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -18px;
    margin-left: -13px;
    filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.5));
    animation: tile-toss 1.9s cubic-bezier(0.25, 0.55, 0.3, 1) forwards;
  }
  @keyframes tile-toss {
    0% {
      transform: translate(var(--start-x), var(--start-y)) rotate(var(--start-rot)) scale(0.9);
      opacity: 1;
    }
    55% {
      transform: translate(0, -14px) rotate(calc(var(--start-rot) * 0.2)) scale(1.06);
    }
    72% {
      transform: translate(0, 5px) rotate(0deg) scale(0.96);
    }
    86% {
      transform: translate(0, -3px) rotate(0deg) scale(1.02);
    }
    100% {
      transform: translate(0, 0) rotate(0deg) scale(1);
    }
  }
  .call-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    background: rgba(15, 20, 15, 0.94);
    border: 2px solid var(--honor-color);
    border-radius: 10px;
    padding: 14px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 60;
  }
  .call-banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .call-banner-label {
    color: var(--honor-color);
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .call-banner-tiles { display: flex; gap: 4px; }

  #hand {
    background: #24262e;
    border: 1px solid #33363f;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 0;
  }
  #log {
    background: #121317;
    border: 1px solid #33363f;
    border-radius: 6px;
    padding: 10px 14px;
    height: 200px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 14px;
  }
  .log-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px;
    min-height: 1.5em;
  }
  #controls {
    min-height: 90px;
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 8px;
    margin-top: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  #controls.call-active {
    border-color: var(--honor-color);
    background: rgba(224, 197, 108, 0.08);
  }
  #controls.call-active .prompt {
    color: var(--honor-color);
    font-weight: bold;
  }
  .prompt {
    margin-bottom: 8px;
    color: #f0f0f0;
    font-size: 14px;
  }
  .call-error {
    margin-bottom: 8px;
    color: #e06c6c;
    font-size: 13px;
  }
  .tile-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button.tile {
    font-family: inherit;
    padding: 2px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform 0.12s;
  }
  button.tile:hover { transform: translateY(-5px); }
  button.tile:active { transform: translateY(-1px); }

  .tile-face {
    width: 50px;
    height: 68px;
    background: linear-gradient(160deg, #fffaf0, #efe6d0);
    border: 1px solid #b9ad8c;
    border-radius: 6px;
    box-shadow: 0 2px 0 #8d8368, 0 3px 4px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: #1b1d22;
  }
  .tile-face.mini {
    width: 26px;
    height: 36px;
    border-radius: 4px;
    box-shadow: 0 1px 0 #8d8368, 0 2px 2px rgba(0, 0, 0, 0.5);
  }
  .tile-face.back {
    background: linear-gradient(160deg, #3c6190, #1b3350);
    border-color: #142840;
  }
  .tile-corner {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 9px;
    color: #8a7f61;
  }
  .tile-face.mini .tile-corner { display: none; }
  .pip-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 74%;
    height: 74%;
    gap: 2px;
  }
  .dot-pip {
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #6fa8f5, #1a4fa0);
    align-self: center;
    justify-self: center;
    width: 72%;
    height: 72%;
  }
  .stick-pip {
    background: linear-gradient(180deg, #6fd97a, #1f8a3a);
    border-radius: 2px;
    width: 34%;
    height: 90%;
    align-self: center;
    justify-self: center;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  }
  .char-face {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .char-face .numeral { font-size: 20px; color: #1f4fbf; font-weight: bold; }
  .char-face .wan { font-size: 15px; color: #c0392b; margin-top: 3px; }
  .tile-face.mini .char-face .numeral { font-size: 12px; }
  .tile-face.mini .char-face .wan { font-size: 9px; margin-top: 1px; }
  .wind-face { font-size: 24px; font-weight: bold; }
  .tile-face.mini .wind-face { font-size: 14px; }
  .tile-pair { display: flex; gap: 5px; }
  .call-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .call-header .prompt { margin-bottom: 0; }
  .meld-group {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: #1b1d22;
    border-radius: 4px;
    border: 1px solid #33363f;
  }

  button.action {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 5px;
    border: 1px solid #45484f;
    background: #33506b;
    color: #fff;
    cursor: pointer;
    margin-right: 8px;
  }
  button.action.secondary { background: #44474f; }
  button.action:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <h1>Mahjong &mdash; Play with a Friend (2 players vs 2 bots)</h1>

  <div id="lobby">
    <h2>Create a table or join one</h2>
    <button class="action" id="createBtn">Create Room</button>
    <div class="divider">— or —</div>
    <input id="roomCodeInput" placeholder="CODE" maxlength="4">
    <button class="action" id="joinBtn">Join Room</button>
    <div id="lobbyStatus"></div>
    <div id="shareLink" style="display:none;"></div>
  </div>

  <div id="gameRoot" style="display:none;">
    <div id="table">
      <div id="animLayer"></div>
      <div class="seat seat-top" id="seat-screen-top">
        <div class="seat-header"><span class="seat-name"></span><div class="seat-backs"></div></div>
        <div class="seat-melds"></div>
        <div class="river"></div>
      </div>
      <div class="seat seat-left" id="seat-screen-left">
        <div class="seat-header"><span class="seat-name"></span><div class="seat-backs"></div></div>
        <div class="seat-melds"></div>
        <div class="river"></div>
      </div>
      <div id="center"><div id="wall-count"></div></div>
      <div class="seat seat-right" id="seat-screen-right">
        <div class="seat-header"><span class="seat-name"></span><div class="seat-backs"></div></div>
        <div class="seat-melds"></div>
        <div class="river"></div>
      </div>
      <div class="seat seat-bottom" id="seat-screen-bottom">
        <div class="river"></div>
        <div class="seat-melds"></div>
        <div class="seat-header"><span class="seat-name"></span></div>
      </div>
    </div>
    <div id="hand"></div>
    <div id="controls"></div>
    <div id="log"></div>
  </div>

<script>
const SUITS = ["C", "B", "O"];
const WINDS = ["EW", "SW", "WW", "NW"];
const HONOR_ORDER = WINDS;

function isSuited(tile) {
  return tile.length === 2 && !isNaN(parseInt(tile[0])) && SUITS.includes(tile[1]);
}

function tileSortValue(tile) {
  if (isSuited(tile)) return SUITS.indexOf(tile[1]) * 100 + parseInt(tile[0]);
  return 1000 + HONOR_ORDER.indexOf(tile);
}

function sortTiles(tiles) {
  return tiles.slice().sort((a, b) => tileSortValue(a) - tileSortValue(b));
}

function counts(tiles) {
  const c = {};
  for (const t of tiles) c[t] = (c[t] || 0) + 1;
  return c;
}

function findChowOptions(hand, tile) {
  if (!isSuited(tile)) return [];
  const rank = parseInt(tile[0]), suit = tile[1];
  const cnt = counts(hand);
  const options = [];
  for (const [d1, d2] of [[-2, -1], [-1, 1], [1, 2]]) {
    const r1 = rank + d1, r2 = rank + d2;
    if (r1 >= 1 && r1 <= 9 && r2 >= 1 && r2 <= 9) {
      const t1 = `${r1}${suit}`, t2 = `${r2}${suit}`;
      if ((cnt[t1] || 0) > 0 && (cnt[t2] || 0) > 0) {
        options.push([t1, t2].sort((a, b) => tileSortValue(a) - tileSortValue(b)));
      }
    }
  }
  return options;
}

const CHAR_NUMERALS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const WIND_CHARACTERS = {EW: "東", SW: "南", WW: "西", NW: "北"};
const DOT_LAYOUTS = {
  1: [[1, 1]],
  2: [[0, 0], [2, 2]],
  3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [0, 2], [2, 0], [2, 2]],
  5: [[0, 0], [0, 2], [1, 1], [2, 0], [2, 2]],
  6: [[0, 0], [0, 2], [1, 0], [1, 2], [2, 0], [2, 2]],
  7: [[0, 0], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 2]],
  8: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]],
  9: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]],
};

function createTileFace(tile, opts = {}) {
  const face = document.createElement("div");
  face.className = "tile-face" + (opts.mini ? " mini" : "");

  if (isSuited(tile)) {
    const rank = parseInt(tile[0]), suit = tile[1];
    const corner = document.createElement("span");
    corner.className = "tile-corner";
    corner.textContent = rank;
    face.appendChild(corner);

    if (suit === "C") {
      const wrap = document.createElement("div");
      wrap.className = "char-face";
      const num = document.createElement("div");
      num.className = "numeral";
      num.textContent = CHAR_NUMERALS[rank];
      const wan = document.createElement("div");
      wan.className = "wan";
      wan.textContent = "萬";
      wrap.appendChild(num);
      wrap.appendChild(wan);
      face.appendChild(wrap);
    } else {
      const grid = document.createElement("div");
      grid.className = "pip-grid";
      const layout = DOT_LAYOUTS[rank];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cell = document.createElement("div");
          if (layout.some(([lr, lc]) => lr === r && lc === c)) {
            cell.className = suit === "O" ? "dot-pip" : "stick-pip";
          }
          cell.style.gridRow = r + 1;
          cell.style.gridColumn = c + 1;
          grid.appendChild(cell);
        }
      }
      face.appendChild(grid);
    }
  } else {
    const wind = document.createElement("div");
    wind.className = "wind-face";
    wind.textContent = WIND_CHARACTERS[tile];
    face.appendChild(wind);
  }

  return face;
}

function createTileBack(mini) {
  const el = document.createElement("div");
  el.className = "tile-face back" + (mini ? " mini" : "");
  return el;
}

function renderTileRow(container, tiles, opts = {}) {
  for (const tile of tiles) container.appendChild(createTileFace(tile, opts));
}

const logEl = document.getElementById("log");
const handEl = document.getElementById("hand");
const controlsEl = document.getElementById("controls");
const animLayerEl = document.getElementById("animLayer");
const wallCountEl = document.getElementById("wall-count");
const lobbyEl = document.getElementById("lobby");
const gameRootEl = document.getElementById("gameRoot");
const lobbyStatusEl = document.getElementById("lobbyStatus");
const shareLinkEl = document.getElementById("shareLink");

const SEAT_ELS = {
  bottom: document.getElementById("seat-screen-bottom"),
  right: document.getElementById("seat-screen-right"),
  top: document.getElementById("seat-screen-top"),
  left: document.getElementById("seat-screen-left"),
};
const ANIM_OFFSET = {
  bottom: {x: 0, y: 170},
  right: {x: 230, y: 0},
  top: {x: 0, y: -170},
  left: {x: -230, y: 0},
};

let mySeat = null;

function seatScreenPos(seatIdx) {
  const rel = (seatIdx - mySeat + 4) % 4;
  return ["bottom", "right", "top", "left"][rel];
}

function log(...parts) {
  const line = document.createElement("div");
  line.className = "log-line";
  for (const part of parts) {
    if (part && part.tile) {
      line.appendChild(createTileFace(part.tile, {mini: true}));
    } else if (Array.isArray(part)) {
      for (const t of part) line.appendChild(createTileFace(t, {mini: true}));
    } else if (part) {
      const span = document.createElement("span");
      span.textContent = part;
      line.appendChild(span);
    }
  }
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function renderSeat(seatIdx, player) {
  const seatEl = SEAT_ELS[seatScreenPos(seatIdx)];
  seatEl.querySelector(".seat-name").textContent = `${player.name}${seatIdx === mySeat ? " (you)" : ""} (${player.handCount})`;

  const backsEl = seatEl.querySelector(".seat-backs");
  if (backsEl) {
    backsEl.innerHTML = "";
    if (seatIdx !== mySeat) {
      for (let i = 0; i < player.handCount; i++) backsEl.appendChild(createTileBack(true));
    }
  }

  const meldsEl = seatEl.querySelector(".seat-melds");
  meldsEl.innerHTML = "";
  for (const meld of player.melds) {
    const group = document.createElement("div");
    group.className = "meld-group";
    renderTileRow(group, meld.tiles, {mini: true});
    meldsEl.appendChild(group);
  }

  const riverEl = seatEl.querySelector(".river");
  riverEl.innerHTML = "";
  renderTileRow(riverEl, player.discards, {mini: true});
}

let lastPlayers = [];

function renderTable(state) {
  lastPlayers = state.players;
  wallCountEl.textContent = `Wall: ${state.wall} tiles left`;
  state.players.forEach(p => renderSeat(p.seat, p));
}

function seatNameFor(seatIdx) {
  const p = lastPlayers.find(p => p.seat === seatIdx);
  return p ? p.name : `Seat ${seatIdx}`;
}

function animateDiscard(seatIdx, tile) {
  const offset = ANIM_OFFSET[seatScreenPos(seatIdx)];
  const el = document.createElement("div");
  el.className = "discard-anim";
  el.style.setProperty("--start-x", `${offset.x}px`);
  el.style.setProperty("--start-y", `${offset.y}px`);
  el.style.setProperty("--start-rot", `${(Math.random() * 24 - 12).toFixed(1)}deg`);
  el.appendChild(createTileFace(tile, {mini: true}));
  animLayerEl.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

function showCallBanner(seatIdx, kind, tiles, seatName) {
  const banner = document.createElement("div");
  banner.className = "call-banner";
  const label = document.createElement("div");
  label.className = "call-banner-label";
  label.textContent = `${seatName} ${kind.toUpperCase()}!`;
  banner.appendChild(label);
  const tilesRow = document.createElement("div");
  tilesRow.className = "call-banner-tiles";
  renderTileRow(tilesRow, tiles, {mini: true});
  banner.appendChild(tilesRow);
  animLayerEl.appendChild(banner);
  setTimeout(() => banner.classList.add("show"), 20);
  setTimeout(() => {
    banner.classList.remove("show");
    setTimeout(() => banner.remove(), 300);
  }, 3000);
}

function clearControls() {
  controlsEl.innerHTML = "";
  controlsEl.classList.remove("call-active");
}

function renderHand(hand, onChoose) {
  handEl.innerHTML = "";
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = onChoose ? "Your hand — click a tile to discard it:" : "Your hand:";
  handEl.appendChild(prompt);
  const row = document.createElement("div");
  row.className = "tile-row";
  for (const tile of sortTiles(hand)) {
    if (onChoose) {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.appendChild(createTileFace(tile));
      btn.onclick = () => onChoose(tile);
      row.appendChild(btn);
    } else {
      row.appendChild(createTileFace(tile));
    }
  }
  handEl.appendChild(row);
}

let currentHand = [];

function renderWaiting() {
  clearControls();
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = "Waiting…";
  controlsEl.appendChild(prompt);
}

function renderCallButtons(discarderName, tile, errorText, canWin, canChow) {
  clearControls();
  controlsEl.classList.add("call-active");
  const headerRow = document.createElement("div");
  headerRow.className = "call-header";
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = `${discarderName} discarded:`;
  headerRow.appendChild(prompt);
  headerRow.appendChild(createTileFace(tile));
  controlsEl.appendChild(headerRow);
  if (errorText) {
    const err = document.createElement("div");
    err.className = "call-error";
    err.textContent = errorText;
    controlsEl.appendChild(err);
  }
  const row = document.createElement("div");
  row.className = "tile-row";
  const labels = ["Pong", "Skip"];
  if (canChow) labels.splice(1, 0, "Chow");
  if (canWin) labels.unshift("Win");
  for (const label of labels) {
    const btn = document.createElement("button");
    btn.className = label === "Skip" ? "action secondary" : "action";
    btn.textContent = label;
    btn.onclick = () => {
      if (label === "Chow") {
        renderChowPicker(tile, discarderName, canWin, canChow);
      } else {
        sendMsg({type: "call_action", action: label.toLowerCase()});
        renderWaiting();
      }
    };
    row.appendChild(btn);
  }
  controlsEl.appendChild(row);
}

function renderChowPicker(tile, discarderName, canWin, canChow) {
  clearControls();
  controlsEl.classList.add("call-active");
  const prompt = document.createElement("div");
  prompt.className = "prompt";
  prompt.textContent = "Choose which tiles to chow with:";
  controlsEl.appendChild(prompt);
  const options = findChowOptions(currentHand, tile);
  const row = document.createElement("div");
  row.className = "tile-row";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "tile";
    const pairWrap = document.createElement("div");
    pairWrap.className = "tile-pair";
    renderTileRow(pairWrap, opt);
    btn.appendChild(pairWrap);
    btn.onclick = () => {
      sendMsg({type: "call_action", action: "chow", pair: opt});
      renderWaiting();
    };
    row.appendChild(btn);
  });
  const back = document.createElement("button");
  back.className = "action secondary";
  back.textContent = "Back";
  back.onclick = () => renderCallButtons(discarderName, tile, "", canWin, canChow);
  controlsEl.appendChild(row);
  controlsEl.appendChild(back);
}

function renderGameOver(data) {
  clearControls();
  const msg = document.createElement("div");
  msg.className = "prompt";
  msg.textContent = data.method === "draw"
    ? "Wall is empty! Game ends in a draw."
    : data.method === "self-draw"
      ? `${data.winnerName} wins by self-draw!`
      : `${data.winnerName} wins off ${data.discarderName}'s discard!`;
  controlsEl.appendChild(msg);

  if (data.winnerName) {
    const handRow = document.createElement("div");
    handRow.className = "tile-row";
    renderTileRow(handRow, data.winningHand);
    controlsEl.appendChild(handRow);

    if (data.melds && data.melds.length) {
      const meldsRow = document.createElement("div");
      meldsRow.className = "seat-melds";
      meldsRow.style.marginTop = "10px";
      for (const meld of data.melds) {
        const group = document.createElement("div");
        group.className = "meld-group";
        renderTileRow(group, meld.tiles, {mini: true});
        meldsRow.appendChild(group);
      }
      controlsEl.appendChild(meldsRow);
    }
  }

  const btn = document.createElement("button");
  btn.className = "action";
  btn.style.marginTop = "10px";
  btn.textContent = "Back to Lobby";
  btn.onclick = () => location.href = location.pathname;
  controlsEl.appendChild(btn);
}

let ws = null;

function sendMsg(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ---- Connection handling ----
// Free hosts drop idle sockets and phones suspend tabs, so a closed socket is
// routine rather than fatal: remember our seat and reclaim it on the way back.
const SESSION_KEY = "mahjongSession";
const MAX_RECONNECT_ATTEMPTS = 12;
let session = null;
let reconnectAttempts = 0;
let reconnectTimer = null;

function saveSession(room, seat, token) {
  session = {room, seat, token};
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
}

function loadSession() {
  if (session) return session;
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
}

function clearSession() {
  session = null;
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

let bannerEl = null;
function setBanner(text) {
  if (!bannerEl) {
    bannerEl = document.createElement("div");
    bannerEl.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:9999;padding:8px 12px;" +
      "text-align:center;font:13px 'SF Mono',Menlo,Consolas,monospace;" +
      "background:#5a3a3a;color:#f0dcdc;border-bottom:1px solid #7a5050;";
    document.body.appendChild(bannerEl);
  }
  bannerEl.textContent = text;
  bannerEl.style.display = text ? "block" : "none";
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    reconnectAttempts = 0;
    const saved = loadSession();
    if (saved && saved.room) {
      session = saved;
      setBanner("Reconnecting to your game\u2026");
      sendMsg({type: "rejoin", room: saved.room, seat: saved.seat, token: saved.token});
      return;
    }
    setBanner("");
    const params = new URLSearchParams(location.search);
    const roomParam = params.get("room");
    if (roomParam) {
      document.getElementById("roomCodeInput").value = roomParam.toUpperCase();
    }
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    handleServerMessage(data);
  };

  ws.onerror = () => { try { ws.close(); } catch (e) {} };

  ws.onclose = () => scheduleReconnect();
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectAttempts++;
  if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
    setBanner("Lost connection. Refresh the page to try again.");
    lobbyStatusEl.textContent = "Disconnected from server.";
    return;
  }
  const delay = Math.min(1000 * Math.pow(1.6, reconnectAttempts - 1), 15000);
  setBanner(`Connection lost \u2014 reconnecting (attempt ${reconnectAttempts})\u2026`);
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, delay);
}

// A tab that wakes from background often has a socket that died silently.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ws && ws.readyState === WebSocket.CLOSED) scheduleReconnect();
});

function handleServerMessage(data) {
  switch (data.type) {
    case "joined": {
      saveSession(data.room, data.seat, data.token);
      setBanner("");
      if (data.waiting) {
        const link = `${location.origin}${location.pathname}?room=${data.room}`;
        shareLinkEl.style.display = "block";
        shareLinkEl.textContent = `Share this link with your opponent: ${link}`;
        lobbyStatusEl.textContent = `Room ${data.room} created — waiting for your opponent to join…`;
      }
      break;
    }
    case "rejoin_failed": {
      clearSession();
      setBanner("");
      lobbyEl.style.display = "block";
      gameRootEl.style.display = "none";
      lobbyStatusEl.textContent =
        "That game is no longer available. Create or join a new room.";
      break;
    }
    case "opponent_joined": {
      lobbyStatusEl.textContent = "Opponent joined! Starting game…";
      break;
    }
    case "error": {
      lobbyStatusEl.textContent = data.message;
      break;
    }
    case "state": {
      mySeat = data.mySeat;
      currentHand = data.yourHand;
      if (gameRootEl.style.display === "none") {
        lobbyEl.style.display = "none";
        gameRootEl.style.display = "block";
      }
      renderTable(data);
      renderHand(currentHand, null);
      renderWaiting();
      break;
    }
    case "log": {
      log(...data.parts);
      break;
    }
    case "discard_anim": {
      animateDiscard(data.seat, data.tile);
      break;
    }
    case "call_banner": {
      showCallBanner(data.seat, data.kind, data.tiles, seatNameFor(data.seat));
      break;
    }
    case "await_discard": {
      clearControls();
      if (data.canWin) {
        const winBtn = document.createElement("button");
        winBtn.className = "action";
        winBtn.textContent = "Win!";
        winBtn.onclick = () => {
          sendMsg({type: "declare_win"});
          renderWaiting();
        };
        controlsEl.appendChild(winBtn);
      }
      renderHand(currentHand, (tile) => {
        sendMsg({type: "discard", tile});
        const idx = currentHand.indexOf(tile);
        if (idx !== -1) currentHand.splice(idx, 1);
        renderHand(currentHand, null);
      });
      break;
    }
    case "await_call": {
      const canChow = (data.isNextPlayer || data.canWin) && findChowOptions(currentHand, data.tile).length > 0;
      renderCallButtons(seatNameFor(data.discarderIdx), data.tile, data.error || "", data.canWin, canChow);
      break;
    }
    case "call_closed": {
      renderWaiting();
      break;
    }
    case "game_over": {
      clearSession();
      renderGameOver(data);
      break;
    }
  }
}


document.getElementById("createBtn").onclick = () => {
  lobbyStatusEl.textContent = "Creating room…";
  sendMsg({type: "create_room"});
};

document.getElementById("joinBtn").onclick = () => {
  const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
  if (!code) {
    lobbyStatusEl.textContent = "Enter a room code first.";
    return;
  }
  lobbyStatusEl.textContent = "Joining room…";
  sendMsg({type: "join_room", room: code});
};

connect();
</script>
